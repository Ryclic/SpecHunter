name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog
      - run: uv sync --locked --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run spechunter compare --backend rtl --iterations 16 --output artifacts/comparison.json
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: spechunter-${{ matrix.python }}
          path: |
            artifacts/
            dist/
          retention-days: 7
  chia:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
          python-version: '3.12'
      - run: uv sync --locked --group dev --extra chia
      - run: timeout 90 uv run --extra chia pytest -q tests/test_chia.py
